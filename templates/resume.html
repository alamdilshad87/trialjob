<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Matcher</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 80px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background-color: #fff;
        }
        .card-header {
            background: linear-gradient(135deg, #007bff, #00c6ff);
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 15px 25px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .card-body {
            padding: 30px;
        }
        .form-group label {
            font-weight: bold;
        }
        .form-control {
            border-radius: 8px;
        }
        #resumes {
            padding: 10px;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        .file-label {
            background-color: #f8f9fa;
            border: 2px dashed #007bff;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .file-label:hover {
            background-color: #e2e6ea;
        }
        .alert-info {
            background-color: #e9f7ff;
            border: 1px solid #b3e5fc;
            border-radius: 8px;
        }
        .result-box {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                🚀 AI-Powered Resume Matcher
            </div>
            <div class="card-body">
                <form method="POST" action="/matcher" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="job_description">🔎 Job Description</label>
                        <textarea class="form-control" id="job_description" name="job_description" rows="5" required placeholder="Paste the job description here..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="resumes">📄 Upload Resumes</label>
                        <div class="file-label" onclick="document.getElementById('resumes').click();">
                            Click here to upload multiple resumes
                        </div>
                        <input type="file" id="resumes" name="resumes" multiple required accept=".pdf, .docx, .txt" class="form-control" style="display: none;">
                        <small class="text-muted">You can upload PDF, DOCX, or TXT files.</small>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">🚀 Match Resumes</button>
                </form>

                {% if message %}
                <div class="alert alert-info mt-4">
                    <strong>{{ message }}</strong>
                    <div class="result-box mt-3">
                        {% for index in range(top_resumes|length) %}
                        <div class="result-item">
                            🎯 {{ top_resumes[index] }} - <strong>Score:</strong> {{ similarity_scores[index] }}
                        </div>
                        {% endfor %}
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script>
        document.getElementById('resumes').addEventListener('change', function() {
            let fileLabel = document.querySelector('.file-label');
            let fileCount = this.files.length;
            if (fileCount > 0) {
                fileLabel.innerHTML = `${fileCount} files selected`;
            } else {
                fileLabel.innerHTML = "Click here to upload multiple resumes";
            }
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
